<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Original illustration for Fitnex: jump rope, mid-jump. -->
  <style>
    .soft{fill:var(--illo-soft,#EFEBFF)} .floor{fill:var(--illo-floor,#E3DFF2)}
    .acc{fill:var(--illo-accent,#7B6CF6)} .acc2{fill:var(--illo-accent-2,#F25C9B)}
    .ink{fill:var(--illo-ink,#2F2E41)} .skin{fill:var(--illo-skin,#F1B899)}
    .s{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .s-skin{stroke:var(--illo-skin,#F1B899)} .s-ink{stroke:var(--illo-ink,#2F2E41)} .s-acc{stroke:var(--illo-accent,#7B6CF6)}
  </style>

  <circle class="soft" cx="200" cy="210" r="160"/>
  <ellipse class="floor" cx="200" cy="372" rx="58" ry="8"/>

  <!-- rope over the head -->
  <path class="s s-ink" stroke-width="4" d="M122 252C96 6 304 6 278 252"/>

  <!-- motion marks -->
