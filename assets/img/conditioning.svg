  <path class="s s-skin" stroke-width="13" d="M218 166L250 214L276 246"/>
  <rect class="acc2" x="114" y="240" width="11" height="24" rx="4" transform="rotate(-20 119 252)"/>
  <rect class="acc2" x="275" y="240" width="11" height="24" rx="4" transform="rotate(20 280 252)"/>
  <rect class="skin" x="192" y="138" width="16" height="24" rx="6"/>
  <circle class="skin" cx="200" cy="124" r="24"/>
