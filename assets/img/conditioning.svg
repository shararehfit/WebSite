  <path class="s s-skin" stroke-width="19" d="M188 272L174 304L186 332"/>
  <path class="s s-skin" stroke-width="19" d="M212 272L228 304L214 332"/>
  <ellipse class="ink" cx="186" cy="338" rx="16" ry="7"/>
  <ellipse class="ink" cx="216" cy="338" rx="16" ry="7"/>
  <path class="acc" d="M178 158c14-8 30-8 44 0l6 84c-18 8-38 8-56 0z"/>
  <path class="acc2" d="M170 234h60l4 40h-26l-8-18-8 18h-26z"/>
