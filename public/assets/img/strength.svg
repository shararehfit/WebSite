<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Original illustration for Fitnex: overhead press. -->
  <style>
    .soft{fill:var(--illo-soft,#EFEBFF)} .floor{fill:var(--illo-floor,#E3DFF2)}
    .acc{fill:var(--illo-accent,#7B6CF6)} .acc2{fill:var(--illo-accent-2,#F25C9B)}
    .ink{fill:var(--illo-ink,#2F2E41)} .skin2{fill:var(--illo-skin-2,#C68863)} .metal{fill:var(--illo-metal,#A7A3BD)}
    .s{fill:none;stroke-linecap:round;stroke-linejoin:round}
    .s-skin2{stroke:var(--illo-skin-2,#C68863)}
  </style>

  <circle class="soft" cx="200" cy="210" r="160"/>
  <ellipse class="floor" cx="200" cy="372" rx="170" ry="10"/>

  <!-- barbell overhead -->
  <rect class="metal" x="36" y="66" width="328" height="8" rx="4"/>
  <rect class="acc" x="50" y="38" width="18" height="64" rx="5"/>
  <rect class="acc" x="70" y="47" width="12" height="46" rx="4"/>
  <rect class="acc" x="332" y="38" width="18" height="64" rx="5"/>
  <rect class="acc" x="318" y="47" width="12" height="46" rx="4"/>

  <!-- lifter -->
  <path class="s s-skin2" stroke-width="20" d="M188 284L178 350"/>
  <path class="s s-skin2" stroke-width="20" d="M212 284L222 350"/>
  <ellipse class="ink" cx="174" cy="358" rx="18" ry="8"/>
  <ellipse class="ink" cx="226" cy="358" rx="18" ry="8"/>
  <path class="s s-skin2" stroke-width="14" d="M182 164L150 120L142 74"/>
  <path class="s s-skin2" stroke-width="14" d="M218 164L250 120L258 74"/>
  <circle class="skin2" cx="142" cy="70" r="8"/>
  <circle class="skin2" cx="258" cy="70" r="8"/>
  <path class="acc2" d="M176 158c16-9 32-9 48 0l6 90c-20 8-40 8-60 0z"/>
  <path class="ink" d="M168 240h64l6 50h-30l-8-24-8 24h-30z"/>
  <rect class="skin2" x="192" y="138" width="16" height="24" rx="6"/>
  <circle class="skin2" cx="200" cy="126" r="24"/>
  <path class="ink" d="M176 124c0-18 10-30 24-30s24 12 24 28c-6-8-14-12-24-12s-18 4-24 14z"/>
</svg>
