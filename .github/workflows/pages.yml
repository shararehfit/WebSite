# Builds the site with `node build.js` and publishes dist/ to GitHub Pages
# on every push to master. Can also be started by hand from the Actions tab.
name: Build and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the site
        run: node build.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
